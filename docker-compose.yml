services:

  web:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - red-app

  db:
    image: mysql:8.0

    env_file:
      - .env

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - red-app

networks:
  red-app:

volumes:
  mysql_data: